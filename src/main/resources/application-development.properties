# =========================================================
# AMBIENTE DE DESARROLLO
# - Ejecucion local, base de datos MySQL servida por XAMPP.
# - Mensajes de depuracion y registro (logs) habilitados.
# - Datos de desarrollo identificables (ver DatosDesarrolloSeeder).
# =========================================================

# XAMPP: MySQL corriendo en localhost:3306, usuario root sin contraseña (valor
# por defecto de XAMPP en instalaciones locales, NO es un dato sensible real).
# createDatabaseIfNotExist=true crea la base si aun no existe (requiere que el
# usuario tenga privilegios CREATE; el "root" de XAMPP los tiene por defecto).
spring.datasource.url=jdbc:mysql://localhost:3306/formulario_contacto_dev?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=

# Hibernate crea/actualiza automaticamente las tablas a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Bandera propia de la aplicacion: habilita el panel/endpoint de depuracion
app.debug=true

# Registro (logging) detallado
logging.level.root=INFO
logging.level.com.lasalle.contacto=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.file.name=logs/app-development.log
