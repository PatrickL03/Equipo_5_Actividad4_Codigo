# Ambiente de pruebas automatizadas
# Base de datos H2 en memoria, independiente de MySQL

spring.datasource.url=jdbc:h2:mem:formulario_contacto_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

app.debug=true
logging.level.root=INFO
logging.level.com.lasalle.contacto=DEBUG
logging.file.name=logs/app-testing.log