# =========================================================
# AMBIENTE DE PRUEBAS
# - Configuracion separada del ambiente de desarrollo.
# - Base de datos MySQL independiente (esquema propio en el
#   mismo servidor de XAMPP, o en otra instancia si se prefiere).
# =========================================================

spring.datasource.url=jdbc:mysql://localhost:3306/formulario_contacto_test?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

app.debug=true

logging.level.root=INFO
logging.level.com.lasalle.contacto=DEBUG
logging.file.name=logs/app-testing.log
