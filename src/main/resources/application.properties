# =========================================================
# Configuracion COMUN a los tres ambientes.
# El perfil activo (development | testing | production) se
# toma de la variable de entorno APP_ENV. Si no se define,
# se usa "development" por defecto.
#
# Cada perfil tiene su propio archivo:
#   application-development.properties
#   application-testing.properties
#   application-production.properties
# =========================================================

spring.application.name=formulario-contacto-lasalle
spring.profiles.active=${APP_ENV:development}

# Render/Railway inyectan el puerto en la variable de entorno PORT
server.port=${PORT:8080}

# Evita el warning de open-in-view en consola
spring.jpa.open-in-view=false
