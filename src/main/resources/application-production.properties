# =========================================================
# AMBIENTE DE PRODUCCION / DEMOSTRACION
# - Mensajes de depuracion deshabilitados.
# - NINGUN dato sensible se escribe aqui: todo llega por
#   variables de entorno definidas en el panel del servicio
#   de despliegue (Render, Railway, etc). Ver .env.example.
# =========================================================

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# "update" se usa por simplicidad academica (crea/actualiza tablas automaticamente).
# En un sistema productivo real se recomendaria "validate" + migraciones (Flyway/Liquibase).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

app.debug=false

logging.level.root=WARN
logging.level.com.lasalle.contacto=INFO
